name: server

on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: karaoke
          POSTGRES_PASSWORD: karaoke
          POSTGRES_DB: karaoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U karaoke -d karaoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://karaoke:karaoke@localhost:5432/karaoke?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: マイグレーションを流す
        run: |
          go install -tags='no_clickhouse no_libsql no_mssql no_mysql no_sqlite3 no_vertica no_ydb' github.com/pressly/goose/v3/cmd/goose@v3.29.0
          goose -dir migrations postgres "$TEST_DATABASE_URL" up

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "::error::gofmt で整えていないファイルがある"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: |
          go test -race -count=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/test.log"
          if grep -E -B1 -e '--- SKIP' "$RUNNER_TEMP/test.log"; then
            echo "::error::飛ばされたテストがある（DB につながっていない可能性）"
            exit 1
          fi

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
